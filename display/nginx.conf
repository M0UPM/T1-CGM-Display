# Serves the display and proxies /api to Nightscout on the same
# origin, so the page never hits CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the page itself - a stale kiosk after an edit is confusing.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://nightscout:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        # Short timeouts: the page would rather show "cannot reach
        # Nightscout" than hang looking healthy.
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
